<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 284" role="img" data-vi-canvas="1" font-family="Inter, Roboto, system-ui, sans-serif" aria-label="A typed sheet of paper: the text on it is the Note literal of this file.">
<g transform="translate(0, 16)">
<g transform="translate(16, 0)">
<text x="0" y="29" text-anchor="start" fill="var(--vi-text-primary, rgba(0,0,0,0.80))" font-weight="700" font-size="21">A typewriter is a literal</text>
</g>
</g>
<g transform="translate(0, 56)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">Note is a quoted literal in Typewriter.swift. Open Full to edit its text.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 76)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">The bench draws the note and its keys; typing into the drawing is not</text>
<text x="0" y="36" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">available.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 116)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">Change the Note literal in Full; the renderer reads the new text.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 136)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">The renderer wraps the text, and the sheet&apos;s height is its line count.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 180)">
<g transform="translate(16, 0)">
<rect x="0" width="480" height="24" rx="12" fill="var(--vi-surface-card, #FFFFFF)" stroke="var(--vi-line, #EAECEE)" stroke-width="1"/>
<g transform="translate(16, 0)">
</g>
</g>
</g>
<g transform="translate(0, 228)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="11">The renderer reports text it cannot draw. This is a limited reading, not Swift compilation.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 248)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="11">A single word wider than the sheet is refused: the renderer names it.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
</svg>
