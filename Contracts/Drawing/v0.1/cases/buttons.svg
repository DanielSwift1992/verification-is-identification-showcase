<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="11">Break it: change PowerOn&apos;s Into to LampOff below, and the On key turns the lamp off.</text>
