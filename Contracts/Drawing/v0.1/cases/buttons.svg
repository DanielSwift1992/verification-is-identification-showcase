<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 784" role="img" data-vi-canvas="1" font-family="Inter, Roboto, system-ui, sans-serif" aria-label="A lamp with On and Off keys, and a four-digit passcode pad whose dots and secret line read their ink from the state&apos;s own term. Every key is a rewrite rule.">
<g transform="translate(0, 16)">
<g transform="translate(16, 0)">
<text x="0" y="29" text-anchor="start" fill="var(--vi-text-primary, rgba(0,0,0,0.80))" font-weight="700" font-size="21">A button is a rewrite rule</text>
</g>
</g>
<g transform="translate(0, 56)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">On this tab a button is a rewrite rule in the file: dynamics as data.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 76)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">A button usually runs code. These rewrite one line: nothing else runs.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 96)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">The judge checks the rules when it reads the file, not when you press.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 128)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">Press On: the line typealias LampMode becomes LampOn, and the dot lights.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 156)">
<g transform="translate(16, 0)">
<circle cx="6" cy="16" r="8" fill="#8A8A8E"/>
</g>
<g transform="translate(36, 0)">
<text x="0" y="21" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">the lamp</text>
</g>
<g transform="translate(108, 0)">
<text x="0" y="21" text-anchor="start" fill="var(--vi-text-primary, rgba(0,0,0,0.80))" font-weight="700" font-size="13">LampOff</text>
</g>
<g transform="translate(328, 0)">
<g class="vi-rule" data-vi-rules="PowerOn" data-vi-slot="LampModeSlot" cursor="pointer">
<rect x="0" width="80" height="32" rx="10" fill="var(--vi-surface-card, #FFFFFF)" stroke="var(--vi-line, #EAECEE)" stroke-width="1"/>
<text x="40" y="21" text-anchor="middle" fill="var(--vi-action, #336FEE)" font-weight="700" font-size="13">On</text>
</g>
</g>
<g transform="translate(416, 0)">
<g class="vi-rule" data-vi-rules="PowerOff" data-vi-slot="LampModeSlot" cursor="pointer">
<rect x="0" width="80" height="32" rx="10" fill="var(--vi-surface-card, #FFFFFF)" stroke="var(--vi-line, #EAECEE)" stroke-width="1"/>
<text x="40" y="21" text-anchor="middle" fill="var(--vi-action, #336FEE)" font-weight="700" font-size="13">Off</text>
</g>
</g>
</g>
<g transform="translate(0, 196)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">The dot reads its color from the state: LampOn declares Ink = AccentRole.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 232)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">Each press of BumpUp is one more Tick: the number is the chain&apos;s count.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 260)">
<g transform="translate(36, 0)">
<text x="0" y="21" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">the count</text>
</g>
<g transform="translate(108, 0)">
<text x="0" y="21" text-anchor="start" fill="var(--vi-text-primary, rgba(0,0,0,0.80))" font-weight="700" font-size="15">0</text>
</g>
<g transform="translate(416, 0)">
<g class="vi-rule" data-vi-rules="BumpUp" data-vi-slot="CountSlot" cursor="pointer">
<rect x="0" width="80" height="32" rx="10" fill="var(--vi-surface-card, #FFFFFF)" stroke="var(--vi-line, #EAECEE)" stroke-width="1"/>
<text x="40" y="21" text-anchor="middle" fill="var(--vi-action, #336FEE)" font-weight="700" font-size="13">+1</text>
</g>
</g>
</g>
<g transform="translate(0, 308)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">The passcode is 4-2-4-2: the dots fill as you walk, a wrong digit resets.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 328)">
<g transform="translate(16, 0)">
<text x="0" y="16" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">A key may list several rules over one slot: at most one From matches the</text>
<text x="0" y="36" text-anchor="start" fill="var(--vi-text-secondary, rgba(0,0,0,0.54))" font-weight="400" font-size="13">current state, and a press applies exactly that rule, or none.</text>
</g>
<g transform="translate(496, 0)">
</g>
</g>
<g transform="translate(0, 384)">
<g transform="translate(16, 0)">
<text x="240" y="15" text-anchor="middle" fill="var(--vi-text-primary, rgba(0,0,0,0.80))" font-weight="700" font-size="13">Enter passcode</text>
</g>
</g>
