name: Docs

# Check the package against the theory revision it pins and deploy its documentation site to
# GitHub Pages on every push to main. The site is never committed: it is built fresh here.
# One-time setup: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: verification-is-identification-showcase
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification-is-identification-showcase

      # The theory checkout sits beside this package at the revision Package.swift pins, so
      # check.sh and the build read the same theory, and the artifacts law can diff the two
      # theory files this package renders.
      - name: The pinned theory revision
        id: theory
        run: echo "revision=$(sed -n 's/^let theoryRevision = "\([0-9a-f]\{40\}\)"$/\1/p' Package.swift)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: DanielSwift1992/verification-is-identification
          ref: ${{ steps.theory.outputs.revision }}
          path: verification-is-identification

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Every law of this package
        env:
          VI_THEORY_PATH: ${{ github.workspace }}/verification-is-identification
        run: ./check.sh

      - name: Generate the combined documentation site
        env:
          VI_THEORY_PATH: ${{ github.workspace }}/verification-is-identification
        run: >
          swift package
          --allow-writing-to-directory "$GITHUB_WORKSPACE/_site"
          generate-documentation
          --enable-experimental-combined-documentation
          --experimental-enable-custom-templates
          --target Organization --target DocumentKit
          --transform-for-static-hosting
          --hosting-base-path verification-is-identification-showcase
          --output-path "$GITHUB_WORKSPACE/_site"

      - name: One hook in every shell (the guard makes a second copy inert)
        run: |
          python3 - << 'EOF'
          import os, pathlib
          hook = pathlib.Path('Sources/Organization/Organization.docc/footer.html').read_text()
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '_site'
          patched = 0
          for shell in root.rglob('index.html'):
              s = shell.read_text()
              if '__viInlineHook' in s or '</body>' not in s:
                  continue
              shell.write_text(s.replace('</body>', hook + '</body>'))
              patched += 1
          print('shells patched:', patched)
          EOF

      - name: Redirect the site root to the company documentation
        run: echo '<!DOCTYPE html><meta charset="utf-8"><title>Verification Is Identification · showcase</title><meta http-equiv="refresh" content="0; url=./documentation/organization/"><a href="./documentation/organization/">Documentation</a>' > "$GITHUB_WORKSPACE/_site/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
